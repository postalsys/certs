on:
    push:
        branches:
            - master
    pull_request:

name: test

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            # Node 22+ loads ES modules through require() by default, which would hide an ESM-only
            # dependency. Run the suite again with that turned off, as the pkg binary EmailEngine
            # ships would load it.
            - run: npm run test:cjs
              if: matrix.node-version != '20.x'
