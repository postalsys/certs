on:
    push:
        branches:
            - master
    # Manual run: publish the version currently on master (used when a release was cut
    # but the publish step failed)
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write
    id-token: write

name: release
jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              if: ${{ github.event_name == 'push' }}
              with:
                  release-type: node
                  package-name: ${{vars.NPM_MODULE_NAME}}
                  pull-request-title-pattern: 'chore${scope}: release ${version} [skip-ci]'
            # The logic below handles the npm publication: it runs when a new release is
            # created, or on a manual dispatch.
            - uses: actions/checkout@v7
              if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false
              if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
            - run: npm ci
              if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
            - run: npm publish --provenance --access public
              if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
